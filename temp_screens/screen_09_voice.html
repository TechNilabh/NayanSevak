<!-- Center Stage: Neural Orb Animation -->
<section class="flex-grow flex items-center justify-center relative">
<!-- Three.js Neural Orb Container -->
<div class="w-[500px] h-[500px] relative flex items-center justify-center">
<!-- STITCH_THREEJS_START:ANIMATION_23 class="absolute inset-0 w-full h-full" -->
<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_23" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_23');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-ANIMATION_23');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Neural Orb - Grouped for rotation
  const group = new THREE.Group();
  scene.add(group);

  // Main Orb Core
  const coreGeo = new THREE.SphereGeometry(1.5, 64, 64);
  const coreMat = new THREE.MeshPhongMaterial({
    color: 0x00E5FF,
    transparent: true,
    opacity: 0.3,
    wireframe: true
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  group.add(core);

  // Floating Particles
  const partCount = 100;
  const partGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(partCount * 3);
  for(let i=0; i<partCount*3; i++) {
    positions[i] = (Math.random() - 0.5) * 4;
  }
  partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const partMat = new THREE.PointsMaterial({ color: 0xFFB300, size: 0.05 });
  const particles = new THREE.Points(partGeo, partMat);
  group.add(particles);

  const light = new THREE.PointLight(0x00E5FF, 1, 10);
  light.position.set(2, 2, 2);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.001;
    
    group.rotation.y += 0.005;
    group.rotation.x += 0.003;
    
    // Pulse effect
    const s = 1 + Math.sin(time * 2) * 0.1;
    core.scale.set(s, s, s);
    
    // Wave-like vertex manipulation would go here, 
    // keeping it lightweight with scale pulse for now.
    
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  animate();
})();
})();
</script>
