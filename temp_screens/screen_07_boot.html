<!-- STITCH_THREEJS_START:ANIMATION_54 class="absolute inset-0 w-full h-full z-0 opacity-80 mix-blend-screen" -->
<div class="absolute inset-0 w-full h-full z-0 opacity-80 mix-blend-screen" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_54" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Group to hold the whole assembly
const bootGroup = new THREE.Group();
scene.add(bootGroup);

// Rotating Tilted Ring (Torus)
const torusGeo = new THREE.TorusGeometry(2, 0.03, 16, 100);
const torusMat = new THREE.MeshPhongMaterial({ 
  color: 0x00E5FF, 
  emissive: 0x00E5FF, 
  emissiveIntensity: 0.5,
  shininess: 100 
});
const ring = new THREE.Mesh(torusGeo, torusMat);
ring.rotation.x = Math.PI / 2.5; // Tilted angle
bootGroup.add(ring);

// Lights to make the "catching light" effect as it spins
const pointLight1 = new THREE.PointLight(0xffffff, 1, 10);
pointLight1.position.set(5, 5, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x00E5FF, 0.5, 10);
pointLight2.position.set(-5, -2, 2);
scene.add(pointLight2);

function animate() {
  requestAnimationFrame(animate);
  const time = Date.now() * 0.001;
  
  // Smooth rotation on vertical axis
  ring.rotation.y = time * 1.5; 
  
  // Subtle pulse in brightness
  torusMat.emissiveIntensity = 0.5 + Math.sin(time * 3) * 0.2;
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

animate();
})();
</script>

<!-- Navigation Redirect Script -->
<script>
        const statuses = [
            "STARTING DASHCAM STREAM...",
            "LOADING DETECTION MODEL...",
            "SYNCING SENSORS...",
            "SYSTEM READY."
        ];
        
        const statusContainer = document.getElementById('status-container');
        let currentIndex = 0;

        function updateStatus() {
            if (currentIndex >= statuses.length) return;
            
            statusContainer.innerHTML = `<span class="fade-text drop-shadow-[0_0_8px_rgba(0,227,253,0.5)]">${statuses[currentIndex]}</span>`;
            currentIndex++;
            
            if (currentIndex < statuses.length) {
                setTimeout(updateStatus, 700);
            }
        }

        // Start sequence
        updateStatus();

        // Redirect
        setTimeout(() => {
            window.location.href = "{{DATA:SCREEN:SCREEN_4}}";
        }, 2800); // 4 statuses * 700ms
    </script>
