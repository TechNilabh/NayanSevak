<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nayan Sevak - AR Dashcam View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration (Provided) -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "primary": "#ffb3b3",
                "surface-tint": "#ffb3b3",

                "surface-dim": "#111318",

                "on-error-container": "#ffdad6",
                "tertiary-fixed-dim": "#aec6ff",

                "on-primary-container": "#5b0011",

                "inverse-on-surface": "#2f3035",
                "on-tertiary-fixed-variant": "#004397",
                "secondary-fixed": "#9cf0ff",
                "inverse-primary": "#bf002e",
                "surface-container-low": "#1a1c20",
                "on-secondary-container": "#00616d",
                "on-primary-fixed": "#400009",
                "surface-bright": "#37393e",
                "primary-fixed-dim": "#ffb3b3",
                "surface-container-lowest": "#0c0e12",
                "error-container": "#93000a",
                "surface-variant": "#333539",
                "secondary-container": "#00e3fd",
                "on-surface": "#e2e2e8",
                "on-tertiary-fixed": "#001a43",
                "surface-container": "#1e2024",
                "surface": "#111318",
                "surface-container-highest": "#333539",
                "on-background": "#e2e2e8",
                "on-tertiary": "#002e6b",
                "on-tertiary-container": "#00275e",
                "inverse-surface": "#e2e2e8",
                "error": "#ffb4ab",
                "primary-fixed": "#ffdad9",
                "background": "#111318",
                "on-surface-variant": "#e8bcbb",
                "tertiary": "#aec6ff",
                "on-secondary": "#00363d",
                "on-secondary-fixed-variant": "#004f58",
                "tertiary-fixed": "#d8e2ff",

            },
            "borderRadius": {

            "spacing": {
                "container-padding": "20px",
                "stack-md": "16px",
                "stack-sm": "8px",
                "stack-lg": "32px",
                "gutter": "16px",
                "margin-screen": "32px",
                "unit": "4px"
            },
            "fontFamily": {
                "label-caps": ["JetBrains Mono", "monospace"],
                "data-stream": ["JetBrains Mono", "monospace"],
                "headline-md": ["Space Grotesk", "sans-serif"],

                "body-md": ["JetBrains Mono", "monospace"]
            },
            "fontSize": {
                "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],

                "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

          }
        }
      }

<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0A0C10; /* Ultra-Dark base */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Experimental Brutalism specific styles */
        .glass-panel {
            background-color: rgba(18, 22, 31, 0.85); /* #12161F with opacity */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* AR Grid Effect */
        .ar-ground-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 218, 243, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 218, 243, 0.15) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: perspective(600px) rotateX(70deg) translateY(50px) scale(2);
            transform-origin: bottom center;
            mask-image: linear-gradient(to bottom, transparent 20%, black 80%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 80%);
        }

        /* Scanline Overlay for tech feel */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Glowing Path Lines */
        .path-line {
            box-shadow: 0 0 15px rgba(0, 218, 243, 0.5);
        }
    </style>
</head>
<body class="w-full h-screen overflow-hidden relative font-body-md text-on-surface select-none">
<!-- 1. Background Camera Feed -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A first-person dashcam view looking out over a multi-lane highway during daytime. The scene is slightly desaturated to mimic an optical sensor feed. The asphalt is detailed and realistic, flanked by concrete barriers and distant city infrastructure under a bright, slightly hazy sky. The lighting is natural but has a stark, high-contrast quality typical of industrial cameras, fitting a high-tech automotive interface aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBIozodCVyBInc3zEyw74AJHAW4v5VEJtq9zBtTcRewoW4n6UG_BZT5bckt5yHvwWTXt6HYtWBlQG6OXNP5w7jfLl6-s2G7UB8PIAJRcHX2cgPx68F-kFPWZDF2Ii8WNWeG_SlTs7-HuhBYwQXNAiJYGeTZ4b2sI77jC6f6IL88oZXgHiMqr8k7Bhiro71cXCQuQliDMlhmHn3Qr3d9-yY80my2LHovcnlmWiMpGA0DWfQTdycStb6DSQ')">
</div>
<!-- Scanline overlay -->
<div class="absolute inset-0 w-full h-full scanlines opacity-30"></div>
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest/20 mix-blend-overlay"></div> <!-- Slight darken -->
<!-- 2. AR Overlay Layer (Ground Plane & Paths) -->
<div class="absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-10 flex items-end justify-center">
<!-- Perspective Grid -->
<div class="absolute bottom-0 w-[150%] h-[120%] ar-ground-grid left-[-25%]"></div>
<!-- Glowing Path Lines (AI Vision Zone) -->
<div class="w-[30%] h-[40%] flex justify-between relative mb-[10%]">
<div class="w-1.5 h-full bg-gradient-to-t from-secondary-fixed-dim via-secondary-fixed-dim to-transparent opacity-80 path-line" style="transform: skewX(-40deg); transform-origin: bottom left;"></div>
<div class="w-1.5 h-full bg-gradient-to-t from-secondary-fixed-dim via-secondary-fixed-dim to-transparent opacity-80 path-line" style="transform: skewX(40deg); transform-origin: bottom right;"></div>
</div>
</div>
<!-- 3. Dynamic Bounding Boxes (AR Objects) -->
<div class="absolute inset-0 w-full h-full pointer-events-none z-20">
<!-- Pothole Bounding Box -->
<div class="absolute top-[65%] left-[32%] w-[180px] h-[70px] border-[1.5px] border-secondary-fixed-dim bg-secondary-fixed-dim/5" style="transform: perspective(500px) rotateX(45deg);">
<!-- Corner Brackets for Brutalist feel -->
<div class="absolute -top-1 -left-1 w-3 h-3 border-t-[1.5px] border-l-[1.5px] border-secondary-fixed-dim"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 border-t-[1.5px] border-r-[1.5px] border-secondary-fixed-dim"></div>
<div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-[1.5px] border-l-[1.5px] border-secondary-fixed-dim"></div>
<div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-[1.5px] border-r-[1.5px] border-secondary-fixed-dim"></div>
<!-- Label -->
<div class="absolute -top-7 left-[-1.5px] bg-secondary-fixed-dim text-[#0A0C10] font-label-caps text-label-caps px-2 py-1 whitespace-nowrap shadow-[0_0_10px_rgba(0,218,243,0.4)]">
                POTHOLE [0.86 CONF]
            </div>
<!-- Crosshair inner -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4">
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-secondary-fixed-dim opacity-50"></div>
<div class="absolute top-0 left-1/2 w-[1px] h-full bg-secondary-fixed-dim opacity-50"></div>
</div>
</div>
<!-- Speed Sign Bounding Box -->
<div class="absolute top-[25%] right-[28%] w-[80px] h-[100px] border-[1.5px] border-[#00ff88] bg-[#00ff88]/5"> <!-- Using a slightly greener cyan variant to distinguish objects, while keeping tech feel -->
<div class="absolute -top-1 -left-1 w-3 h-3 border-t-[1.5px] border-l-[1.5px] border-[#00ff88]"></div>
<div class="absolute -top-1 -right-1 w-3 h-3 border-t-[1.5px] border-r-[1.5px] border-[#00ff88]"></div>
<div class="absolute -bottom-1 -left-1 w-3 h-3 border-b-[1.5px] border-l-[1.5px] border-[#00ff88]"></div>
<div class="absolute -bottom-1 -right-1 w-3 h-3 border-b-[1.5px] border-r-[1.5px] border-[#00ff88]"></div>
<div class="absolute -top-7 right-[-1.5px] bg-[#00ff88] text-[#0A0C10] font-label-caps text-label-caps px-2 py-1 whitespace-nowrap shadow-[0_0_10px_rgba(0,255,136,0.3)] text-right">
                SPEED 100 [0.94]
            </div>
</div>
<!-- Distant Vehicle Box -->
<div class="absolute top-[52%] left-[48%] w-[50px] h-[40px] border border-outline/50 bg-outline/10">
<div class="absolute -top-5 left-0 text-outline font-data-stream text-data-stream text-[9px] bg-[#0A0C10]/80 px-1">VEHICLE</div>
</div>
</div>
<!-- 4. HUD Layer (Information on highest optical plane) -->
<div class="absolute inset-0 w-full h-full pointer-events-none p-margin-screen flex flex-col justify-between z-30">
<!-- Top Container Area -->
<div class="w-full flex justify-center mt-4">
<!-- Floating HUD Widget (Top Glass Pill) -->
<div class="glass-panel rounded-full px-8 py-3.5 flex items-center gap-8 shadow-[0_0_20px_rgba(0,0,0,0.5)]">
<!-- Speed Data -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed-dim icon-filled text-2xl">speed</span>
<div class="flex flex-col justify-center">
<span class="font-label-caps text-[10px] text-on-surface-variant leading-tight tracking-widest uppercase">Speed</span>
<span class="font-data-stream text-[14px] font-bold text-on-surface leading-tight tracking-wider">84 KM/H</span>
</div>
</div>
<!-- Separator -->
<div class="w-px h-8 bg-white/10"></div>
<!-- Latency Data -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed-dim text-2xl">memory</span>
<div class="flex flex-col justify-center">
<span class="font-label-caps text-[10px] text-on-surface-variant leading-tight tracking-widest uppercase">AI Latency</span>
<div class="flex items-baseline gap-1">
<span class="font-data-stream text-[14px] font-bold text-on-surface leading-tight tracking-wider">31ms</span>
<div class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim shadow-[0_0_5px_#00daf3] animate-pulse"></div>
</div>
</div>
</div>
<!-- Separator -->
<div class="w-px h-8 bg-white/10"></div>
<!-- Scene Data -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed-dim text-2xl">visibility</span>
<div class="flex flex-col justify-center">
<span class="font-label-caps text-[10px] text-on-surface-variant leading-tight tracking-widest uppercase">Scene</span>
<span class="font-data-stream text-[14px] font-bold text-on-surface leading-tight tracking-wider">CLEAR SKY · 94% VIS</span>
</div>
</div>
</div>
</div>
<!-- Bottom Area -->
<div class="w-full flex justify-end items-end pb-2">
<!-- Brutalist Tactical Button -->
<button class="pointer-events-auto bg-transparent border-[1.5px] border-secondary-fixed-dim text-secondary-fixed-dim font-label-caps text-label-caps px-6 py-4 rounded-none hover:bg-secondary-fixed-dim hover:text-[#0A0C10] transition-colors duration-200 flex items-center gap-3 shadow-[0_0_15px_rgba(0,218,243,0.15)] group">
<span class="tracking-widest mt-0.5">EXIT FULL-SCREEN [ESC]</span>
<span class="material-symbols-outlined text-[18px] group-hover:rotate-180 transition-transform duration-300">close_fullscreen</span>
</button>
</div>
</div>
</body></html>
