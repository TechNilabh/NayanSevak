<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nayan Sevak - Main Flight Deck HUD</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/css/hud_styles.css"/>
</head>
<body class="bg-[#0A0C10] text-[#e2e2e8] h-screen w-screen overflow-hidden font-sans select-none">

    <!-- Canonical Top App Bar (#top-hud-bar) -->
    <header id="top-hud-bar" class="fixed top-0 left-0 right-0 flex justify-between items-center px-8 z-50 bg-[#0A0C10]/80 backdrop-blur-md h-12 border-b border-white/10 text-xs font-mono text-[#00E5FF]">
        <div class="flex items-center gap-4">
            <span id="top-clock" class="font-mono font-bold text-white">14:28</span>
            <div class="flex items-center gap-2 text-slate-400">
                <span class="material-symbols-outlined text-[16px]">cloud</span>
                <span>72°F Outside AQI: 42 (Good)</span>
            </div>
        </div>
        <div class="tracking-widest text-[#00E5FF] flex items-center gap-2 font-mono">
            <div class="w-6 h-6 rounded-full bg-[#00E5FF] flex items-center justify-center text-[#0A0C10] text-[10px] font-bold">MK</div>
            NAYAN SEVAK · DUAL-AI
            <div class="ml-2 px-2 py-0.5 rounded-full border border-[#00E5FF] text-[10px] flex items-center gap-1">
                <div class="w-1.5 h-1.5 bg-[#00E5FF] rounded-full animate-pulse"></div>
                SYNCED
            </div>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono">
            <span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
            <span>5G UWB</span>
            <span class="material-symbols-outlined text-[16px] text-green-400">battery_charging_full</span>
            <span id="top-battery" class="text-green-400 font-bold">84%</span>
        </div>
    </header>

    <!-- Canonical Persistent Left Side Nav Bar (#dock-nav) -->
    <nav id="dock-nav" class="fixed left-0 top-12 bottom-12 flex flex-col items-center py-6 z-40 bg-[#1e2024]/60 backdrop-blur-xl vertical-left ml-4 my-8 rounded-full w-20 border border-white/10 shadow-[0_0_15px_rgba(0,227,253,0.1)]">
        <div class="flex flex-col gap-6 w-full px-2 mt-4">
            <!-- Welcome / Pre-Drive -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90" data-screen="screen_00_welcome" title="Pre-Drive Welcome">
                <span class="material-symbols-outlined">shield</span>
            </button>
            <!-- Cockpit / Flight Deck -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90 active-dock" data-screen="screen_01_cockpit" title="Main Flight Deck">
                <span class="material-symbols-outlined">home</span>
            </button>
            <!-- Hazard Takeover Direct Modal -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90" data-screen="screen_02_takeover" title="Hazard Alert Takeover">
                <span class="material-symbols-outlined text-red-500">minor_crash</span>
            </button>
            <!-- Sensor Primary Mode -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90" data-screen="screen_03_sensor_primary" title="Sensor-Primary Mode">
                <span class="material-symbols-outlined">sensors</span>
            </button>
            <!-- Live AR Windshield -->
            <button class="dock-item flex flex-col items-center justify-center bg-[#00e3fd]/20 text-[#00E5FF] rounded-full p-3 hover:bg-white/10 transition-all scale-95 active:scale-90 relative" data-screen="screen_06_ar_dashcam" title="Live AR Dashcam">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">visibility</span>
                <div class="absolute -right-1 top-0 w-2 h-2 bg-[#00E5FF] rounded-full shadow-[0_0_8px_#00E5FF]"></div>
            </button>
            <!-- Analytics -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90" data-screen="screen_04_analytics" title="Trip Analytics">
                <span class="material-symbols-outlined">bolt</span>
            </button>
            <!-- Hazard Logs -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90" data-screen="screen_08_logs" title="Hazard Logs">
                <span class="material-symbols-outlined">album</span>
            </button>
            <!-- Calibration -->
            <button class="dock-item flex flex-col items-center justify-center text-slate-400 p-3 hover:bg-white/10 transition-all rounded-full scale-95 active:scale-90 mt-auto" data-screen="screen_05_calibration" title="Calibration & Settings">
                <span class="material-symbols-outlined">settings</span>
            </button>
        </div>
    </nav>

    <!-- Main Canvas for Standard Non-Overlay Grid Screens (01, 03, 04, 05, 06, 08, 11) -->
    <main id="hud-content" class="absolute top-12 left-24 right-0 bottom-7 overflow-hidden p-6">
        <!-- Standard Screen Partials Injected Here -->
    </main>

    <!-- Full-Bleed Overlay Container for Overlay Screens (00, 02, 07, 09, 10) -->
    <div id="hud-overlay" class="hud-overlay hidden">
        <!-- Overlay Screen Partials Injected Here -->
    </div>

    <!-- Canonical Bottom Diagnostic Ticker (#bottom-hud-ticker) -->
    <div id="bottom-hud-ticker" class="fixed bottom-0 left-0 right-0 h-[30px] bg-[#0C0E14]/80 backdrop-blur-sm border-t border-white/5 flex items-center px-8 z-50">
        <span class="font-telemetry text-[11px] text-[#00E5FF]/70 tracking-wider">SYS: YOLOv8n @ 31ms | GPS: LOCKED | BUS: OK | LOOP: 30fps</span>
    </div>

    <!-- Scripts -->
    <script src="/static/js/hud_router.js"></script>
</body>
</html>
