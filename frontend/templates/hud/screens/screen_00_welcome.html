<!-- Screen 00: Pre-Drive Welcome & Ignition Stage -->
<div class="hud-overlay w-full h-full flex flex-col items-center justify-between p-8 relative overflow-hidden bg-[#0A0C10]">

    <!-- Background Subtle Radial Grid -->

        <div class="w-[460px] h-[460px] rounded-full border border-[#00E5FF]/30 absolute"></div>
        <div class="w-[280px] h-[280px] rounded-full border border-[#FFB300]/20 absolute"></div>
    </div>

    <!-- Header: Ocular Shield Emblem -->
    <div class="z-10 flex flex-col items-center gap-2 mt-4 text-center">

    <div class="z-10 relative my-auto flex flex-col items-center justify-center">
        <div class="relative w-[340px] h-[200px] flex items-center justify-center">
            <!-- Elliptical Radial Floor Grid -->
            <svg class="absolute inset-0 w-full h-full opacity-50" viewBox="0 0 340 200">
                <ellipse cx="170" cy="100" rx="150" ry="75" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5" stroke-dasharray="6 4"/>

                <rect x="25" y="30" width="150" height="60" rx="20" fill="rgba(18, 22, 31, 0.95)" stroke="#00E5FF" stroke-width="2"/>

                <!-- Amber Fender Arcs -->
                <path d="M 25 45 Q 40 40 55 45" stroke="#FFB300" stroke-width="2.5" fill="none"/>
                <path d="M 25 75 Q 40 80 55 75" stroke="#FFB300" stroke-width="2.5" fill="none"/>
                <path d="M 145 45 Q 160 40 175 45" stroke="#FFB300" stroke-width="2.5" fill="none"/>
                <path d="M 145 75 Q 160 80 175 75" stroke="#FFB300" stroke-width="2.5" fill="none"/>

                <polygon points="175,75 200,62 200,88" fill="rgba(0, 229, 255, 0.15)" stroke="#00E5FF" stroke-width="0.5"/>

                <rect x="136" y="20" width="22" height="10" rx="3" fill="#0A0C10" stroke="#00E5FF" stroke-width="1"/>
                <rect x="42" y="90" width="22" height="10" rx="3" fill="#0A0C10" stroke="#00E5FF" stroke-width="1"/>
                <rect x="136" y="90" width="22" height="10" rx="3" fill="#0A0C10" stroke="#00E5FF" stroke-width="1"/>

                <!-- Core Sensor Node -->
                <circle cx="100" cy="60" r="7" fill="#00E5FF"/>

        <!-- High-Affordance CTA Button -->
        <button id="btn-engage-deck" onclick="HUDRouter.navigateTo('screen_07_boot')" class="mt-8 px-10 py-3.5 rounded-full bg-[#00E5FF]/10 hover:bg-[#00E5FF]/25 border-2 border-[#00E5FF] text-[#00E5FF] font-bold text-sm tracking-widest font-mono transition-all duration-300 shadow-[0_0_20px_rgba(0,229,255,0.3)] hover:shadow-[0_0_35px_rgba(0,229,255,0.6)] hover:scale-105 active:scale-95 flex items-center gap-3">

        <p class="text-xs text-slate-400 font-mono mt-3">Click or press brake to initialize multi-modal AI perception</p>

    <!-- Flanking Telemetry Stats Cards -->
    <div class="z-10 w-full max-w-3xl flex justify-between items-center gap-6 mb-4 font-mono">

        <div class="glass-card flex-1 p-4 flex items-center gap-4 bg-[#12161F]/90 border border-white/10 rounded-2xl">

                <div class="text-xs font-bold text-white tabular-nums">YOLOv8n: ARMED · WOKWI: STANDBY</div>
            </div>
        </div>

</div>
