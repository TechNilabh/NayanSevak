<script>
(function () {
    async function loadTripSummary() {
        try {
            const res = await fetch('/api/trip/summary');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            // Hazards Logged
            const hazEl = document.getElementById('summary-hazards-count');
            if (hazEl) hazEl.textContent = data.total_hazards != null ? data.total_hazards : '--';

            // Drive Time (convert seconds → minutes, show as whole number)
            const dtEl = document.getElementById('summary-drive-time');
            if (dtEl) {
                const minutes = data.duration_seconds != null
                    ? Math.floor(data.duration_seconds / 60)
                    : '--';
                dtEl.textContent = minutes;
            }

            // NOTE: TOTAL DISTANCE and SAFETY INDEX are intentionally left as
            // static placeholders — no real GPS source exists yet. Do not wire
            // fabricated numbers into those fields.
        } catch (err) {
            console.warn('[screen_11_summary] Failed to load trip summary:', err);
        }
    }

    loadTripSummary();
})();
</script>
